name: Scan and publish

on:
  schedule:
    # Every 15 minutes, 13:00-21:45 UTC on weekdays. That covers the US session
    # (9:30 AM-4:00 PM Eastern) in both EST and EDT, plus the after-close run.
    # GitHub may start scheduled runs a few minutes late.
    - cron: "*/15 13-21 * * 1-5"
    # Early morning run for the daily email: 7:30 AM EST / 8:30 AM EDT.
    - cron: "30 12 * * 1-5"
  workflow_dispatch:
    inputs:
      send_email:
        description: "Send the top-10 email now (a test, even if the market is open)"
        type: boolean
        default: false

permissions:
  contents: write   # commit the daily history file
  pages: write      # publish the dashboard
  id-token: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # The earnings calendar is fetched once a day, not every 15 minutes.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: earnings-${{ steps.day.outputs.day }}

      - name: Run scan
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: |
          if [ -z "$ALPACA_API_KEY_ID" ] || [ -z "$ALPACA_API_SECRET_KEY" ]; then
            echo "::error::Add the ALPACA_API_KEY_ID and ALPACA_API_SECRET_KEY repository secrets."
            exit 1
          fi
          EXTRA=""
          if [ -n "$ALPHAVANTAGE_API_KEY" ]; then EXTRA="--earnings"; fi
          python breakout_scanner.py --source alpaca --site site $EXTRA

      # Call contracts for the top 10. A failure here leaves the scanner page working.
      - name: Option chains
        continue-on-error: true
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: python options_scan.py site/data/latest.json site/data/options.json

      # Once per trading day, after the close, keep a copy of the final scan.
      # This also keeps the repository active so GitHub doesn't pause the schedule.
      - name: Save daily history
        id: history
        run: |
          prov=$(jq -r .meta.provisional site/data/latest.json)
          d=$(jq -r .meta.bar_date site/data/latest.json)
          if [ "$prov" = "false" ] && [ "$d" != "null" ] && [ ! -f "history/$d.csv" ]; then
            mkdir -p history
            cp site/data/latest.csv "history/$d.csv"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add history
            git commit -m "Scan history for $d"
            git push
            echo "saved=true" >> "$GITHUB_OUTPUT"
          else
            echo "No history to save (provisional=$prov, bar_date=$d)."
          fi

      # The daily email goes out once each weekday morning, from the first run that
      # still shows the previous day's final close (before intraday data starts
      # around 9:45 AM Eastern). history/emailed.txt records the days already sent.
      # Running the workflow by hand with "send_email" ticked sends one right away.
      - name: Decide on email
        id: mail
        run: |
          today=$(TZ=America/New_York date +%F)
          dow=$(TZ=America/New_York date +%u)
          hhmm=$(TZ=America/New_York date +%H%M)
          prov=$(jq -r .meta.provisional site/data/latest.json)
          d=$(jq -r .meta.bar_date site/data/latest.json)
          sent=no
          if [ -f history/emailed.txt ] && grep -qx "$today" history/emailed.txt; then sent=yes; fi
          if [ "${{ inputs.send_email }}" = "true" ]; then
            echo "send=test" >> "$GITHUB_OUTPUT"
          elif [ "$dow" -le 5 ] && [ "$hhmm" -lt 1100 ] && [ "$prov" = "false" ] && [ "$d" != "$today" ] && [ "$sent" = "no" ]; then
            echo "send=daily" >> "$GITHUB_OUTPUT"
          fi
          echo "today=$today dow=$dow time=$hhmm provisional=$prov bar_date=$d already_sent=$sent"

      - name: Email top 10
        if: steps.mail.outputs.send != ''
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          DASHBOARD_URL: https://seanpesner-lab.github.io/OptionsDash/
        run: |
          if [ -z "$SMTP_USER" ] || [ -z "$SMTP_PASSWORD" ] || [ -z "$EMAIL_TO" ]; then
            echo "::warning::Email skipped: add the SMTP_USER, SMTP_PASSWORD and EMAIL_TO secrets."
            exit 0
          fi
          python notify.py site/data/latest.json --options site/data/options.json
          if [ "${{ steps.mail.outputs.send }}" = "daily" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            mkdir -p history
            TZ=America/New_York date +%F >> history/emailed.txt
            git add history/emailed.txt
            git commit -m "Daily email sent $(TZ=America/New_York date +%F)"
            git pull --rebase -q && git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
